services:
  spatial-content-discovery:
    image: oscp/oscp-spatial-content-discovery:latest
    container_name: oscp-spatial-content-discovery
    env_file:
      - .env
    ports:
      - ${PORT:-8032}:${PORT:-8032}
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP_PORT: ${PORT:-8032}
    volumes:
      - ./${KAPPA_CORE_DIR:-data}:/app/${KAPPA_CORE_DIR:-data}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||'8032')+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
